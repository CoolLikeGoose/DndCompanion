name: Bug Report
description: Create a new ticket for a bug.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "## Bug Report"
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Create '...'
        2. Open '.....'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Current behavior
  - type: textarea
    id: proposed
    attributes:
      label: Proposed solution
  - type: input
    id: os
    attributes:
      label: OS
  - type: input
    id: dotnet
    attributes:
      label: .NET Version
  - type: input
    id: browser
    attributes:
      label: Browser
