name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .
          retention-days: 1

  domain-tests:
    name: Domain Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test DndCompanion.Domain.Tests/DndCompanion.Domain.Tests.csproj --no-build --configuration Release --verbosity normal

  application-tests:
    name: Application Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test DndCompanion.Application.Tests/DndCompanion.Application.Tests.csproj --no-build --configuration Release --verbosity normal

  infrastructure-tests:
    name: Infrastructure Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test DndCompanion.Infrastructure.Tests/DndCompanion.Infrastructure.Tests.csproj --no-build --configuration Release --verbosity normal
